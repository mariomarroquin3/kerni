# Builds the Windows installers and publishes them to GitHub Releases.
#
# The installer includes the backend: `npm run backend:preparar` copies src/backend
# (production dependencies only) and a verified node.exe into src-tauri/resources,
# and the app starts the backend by itself. On first run the app asks which AI
# service to use and for the person's own API key (or to go on without AI).
#
# The installers are not code-signed yet, so Windows SmartScreen may warn.
# Only first-party actions are used; the release is created with the GitHub
# CLI (preinstalled on the runner) and the job's GITHUB_TOKEN.

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Check the tag format
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "Tag '$env:TAG' does not look like vMAJOR.MINOR.PATCH"
            exit 1
          }

      - name: Backend tests
        working-directory: src/backend
        run: |
          npm ci
          npm test

      - name: Desktop install and tests
        working-directory: src/desktop
        run: |
          npm ci
          npm test

      - name: Build the web front (needed by Tauri)
        working-directory: src/desktop
        run: npm run web:build

      - name: Rust tests
        working-directory: src/desktop/src-tauri
        run: cargo test

      - name: Bundle the backend and Node.js (so the installer works without Node installed)
        working-directory: src/desktop
        run: npm run backend:preparar

      - name: Build the app
        working-directory: src/desktop
        run: npx tauri build

      - name: Collect the installers
        shell: pwsh
        run: |
          $bundle = "src/desktop/src-tauri/target/release/bundle"
          $nsis = @(Get-ChildItem "$bundle/nsis/*.exe" -ErrorAction SilentlyContinue)
          $msi = @(Get-ChildItem "$bundle/msi/*.msi" -ErrorAction SilentlyContinue)
          if ($nsis.Count -eq 0 -or $msi.Count -eq 0) {
            Write-Error "Missing installers: nsis=$($nsis.Count) msi=$($msi.Count)"
            exit 1
          }
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $nsis + $msi | Copy-Item -Destination dist-release
          Get-ChildItem dist-release | Format-Table Name, Length

      - name: Write the release notes
        shell: pwsh
        run: |
          $notes = @(
            "Kerni $env:TAG para Windows 10 u 11."
            ""
            "- Instalador recomendado: el archivo que termina en _x64-setup.exe. También hay un .msi."
            "- El instalador todavía no tiene firma digital, por eso Windows SmartScreen puede avisar. Si lo bajaste desde esta página, tocá 'Más información' y luego 'Ejecutar de todas formas'."
            "- El instalador ya trae el backend y Node.js: no hace falta instalar nada más."
            "- La primera vez que abrís Kerni te pide elegir el servicio de IA (Gemini, OpenRouter o Anthropic) y pegar tu propia llave. También podés seguir sin IA: Kerni responde con sus reglas y sus guías, y las métricas, el modo pánico y las herramientas funcionan igual."
            "- Tu llave se guarda solo en tu compu, en la carpeta de datos de Kerni, y solo se envía al servicio que elegiste."
          )
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = (Get-ChildItem dist-release).FullName
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --title "Kerni $env:TAG" --notes-file release-notes.md --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
