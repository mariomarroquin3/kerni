name: build-windows

on:
  push:
    branches: [Rama-de-John]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/desktop/src-tauri
      - name: Install dependencies
        working-directory: src/desktop
        run: npm ci
      - name: Build app
        working-directory: src/desktop
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: kerni-windows
          path: |
            src/desktop/src-tauri/target/release/kerni.exe
            src/desktop/src-tauri/target/release/bundle/nsis/*.exe
