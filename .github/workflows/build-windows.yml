name: build-windows

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/desktop/src-tauri

      - name: Backend tests
        working-directory: src/backend
        run: |
          npm ci
          npm test

      - name: Desktop install and tests
        working-directory: src/desktop
        run: |
          npm ci
          npm test

      - name: Build the web front (needed by Tauri)
        working-directory: src/desktop
        run: npm run web:build

      - name: Rust tests
        working-directory: src/desktop/src-tauri
        run: cargo test

      - name: Build the app
        working-directory: src/desktop
        run: npx tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: kerni-windows
          path: |
            src/desktop/src-tauri/target/release/kerni.exe
            src/desktop/src-tauri/target/release/bundle/nsis/*.exe
