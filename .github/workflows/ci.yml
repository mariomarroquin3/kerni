name: ci

# Pruebas rápidas en cada push y pull request. No compila el instalador (eso lo hace build-windows.yml, a mano).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend tests
        working-directory: src/backend
        run: |
          npm ci
          npm test

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Desktop tests
        working-directory: src/desktop
        run: |
          npm ci
          npm test

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/desktop/src-tauri
      # Tauri necesita la carpeta del front (dist) al compilar; por eso se construye antes de cargo test.
      - name: Build the web front (needed by Tauri)
        working-directory: src/desktop
        run: |
          npm ci
          npm run web:build
      - name: Rust tests
        working-directory: src/desktop/src-tauri
        run: cargo test

  # Dependency audit. These steps are blocking on purpose: do not add `|| true` or lower the level to make CI green.
  # To review a failure: run the same command locally, read the advisory (GHSA / RUSTSEC id), check whether the
  # vulnerable code path is reachable in Kerni, then update the dependency (`npm audit fix`, `cargo update -p <crate>`)
  # or, only if there is no fix and the path is unreachable, record the decision in docs/security.md.
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # npm audit reads package-lock.json; runtime dependencies only, fails on high or critical.
      - name: npm audit (backend)
        working-directory: src/backend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (desktop)
        working-directory: src/desktop
        run: npm audit --omit=dev --audit-level=high
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit (Rust core)
        working-directory: src/desktop/src-tauri
        run: cargo audit
