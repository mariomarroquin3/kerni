<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#44475a"/>
    </marker>
  </defs>

  <!-- Front -->
  <rect x="40" y="60" width="300" height="215" rx="10" fill="#eef4ff" stroke="#2a6df4" stroke-width="2"/>
  <text x="60" y="92" font-size="15" font-weight="bold" fill="#1d1d1f">Front (window)</text>
  <text x="60" y="112" font-size="11" fill="#5b6070">src/desktop/web · vanilla JS, Vite</text>
  <text x="60" y="140" font-size="12" fill="#1d1d1f">main.js: cards, chat, HUD</text>
  <text x="60" y="162" font-size="12" fill="#1d1d1f">estado.js, intenciones.js (local rules)</text>
  <text x="60" y="184" font-size="12" fill="#1d1d1f">herramientas.js: card texts</text>
  <text x="60" y="206" font-size="12" fill="#1d1d1f">Rive character (kerni.riv)</text>
  <text x="60" y="228" font-size="12" fill="#1d1d1f">renders text with textContent only</text>
  <text x="60" y="250" font-size="12" fill="#1d1d1f">estado-ia.js: AI status chip (state logic)</text>
  <text x="60" y="262" font-size="11" fill="#5b6070">shows Con IA, Sin IA, or cupo agotado</text>

  <!-- Rust core -->
  <rect x="40" y="310" width="300" height="225" rx="10" fill="#fff4e8" stroke="#e08a1e" stroke-width="2"/>
  <text x="60" y="342" font-size="15" font-weight="bold" fill="#1d1d1f">Rust core (Tauri)</text>
  <text x="60" y="362" font-size="11" fill="#5b6070">src/desktop/src-tauri · the only code that touches the PC</text>
  <text x="60" y="390" font-size="12" fill="#1d1d1f">sistema.rs: metrics, close process, temp, files</text>
  <text x="60" y="412" font-size="12" fill="#1d1d1f">herramientas.rs: startup, network, updates,</text>
  <text x="60" y="430" font-size="12" fill="#1d1d1f">  recycle bin, settings</text>
  <text x="60" y="452" font-size="12" fill="#1d1d1f">diagnostico.rs: boot, disk health, restore,</text>
  <text x="60" y="470" font-size="12" fill="#1d1d1f">  duplicates, unused programs, battery</text>
  <text x="60" y="492" font-size="12" fill="#1d1d1f">congelar.rs: freeze and resume processes</text>
  <text x="60" y="510" font-size="12" fill="#1d1d1f">navegadores.rs: browser cache (Chrome, Edge)</text>
  <text x="60" y="528" font-size="11" fill="#5b6070">re-validates every request</text>

  <!-- Backend -->
  <rect x="400" y="60" width="340" height="440" rx="10" fill="#eefaf3" stroke="#2e9e5b" stroke-width="2"/>
  <text x="420" y="92" font-size="15" font-weight="bold" fill="#1d1d1f">Backend (local)</text>
  <text x="420" y="112" font-size="11" fill="#5b6070">src/backend · Node 22 + Fastify · 127.0.0.1:8788</text>
  <text x="420" y="140" font-size="12" fill="#1d1d1f">routes: /chat /health /memoria /enlaces</text>
  <text x="420" y="166" font-size="12" fill="#1d1d1f">agent.js: tool-calling loop (max 4 steps)</text>
  <text x="420" y="192" font-size="12" fill="#1d1d1f">acciones.js: validates proposals vs snapshot</text>
  <text x="420" y="218" font-size="12" fill="#1d1d1f">intenciones.js: keyword fallback</text>
  <text x="420" y="244" font-size="12" fill="#1d1d1f">llm/: provider adapters, one step() interface</text>
  <text x="420" y="270" font-size="12" fill="#1d1d1f">memoria/: SQLite kerni.db, reflections</text>
  <text x="420" y="296" font-size="12" fill="#1d1d1f">rag/: knowledge search, used as a tool</text>
  <text x="420" y="330" font-size="11" fill="#5b6070">Kerni proposes; the person approves on a card.</text>
  <text x="420" y="350" font-size="11" fill="#5b6070">The model never executes anything.</text>

  <!-- Providers -->
  <rect x="800" y="60" width="170" height="130" rx="10" fill="#f4f4f6" stroke="#888" stroke-width="2"/>
  <text x="820" y="92" font-size="14" font-weight="bold" fill="#1d1d1f">Model provider</text>
  <text x="820" y="118" font-size="12" fill="#1d1d1f">Anthropic</text>
  <text x="820" y="138" font-size="12" fill="#1d1d1f">Gemini, OpenRouter</text>
  <text x="820" y="162" font-size="11" fill="#5b6070">one chosen by config</text>

  <!-- Knowledge -->
  <rect x="800" y="250" width="170" height="110" rx="10" fill="#f4f4f6" stroke="#888" stroke-width="2"/>
  <text x="820" y="282" font-size="14" font-weight="bold" fill="#1d1d1f">Knowledge base</text>
  <text x="820" y="306" font-size="12" fill="#1d1d1f">pgvector, optional</text>
  <text x="820" y="326" font-size="11" fill="#5b6070">Docker or Supabase Cloud</text>

  <!-- Arrows -->
  <line x1="340" y1="150" x2="398" y2="150" stroke="#44475a" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="370" y="142" font-size="11" text-anchor="middle" fill="#44475a">HTTP JSON</text>

  <line x1="190" y1="276" x2="190" y2="308" stroke="#44475a" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="200" y="296" font-size="11" fill="#44475a">invoke()</text>

  <line x1="740" y1="130" x2="798" y2="130" stroke="#44475a" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="769" y="122" font-size="11" text-anchor="middle" fill="#44475a">API</text>

  <line x1="740" y1="305" x2="798" y2="305" stroke="#44475a" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="769" y="297" font-size="11" text-anchor="middle" fill="#44475a">search</text>
</svg>
