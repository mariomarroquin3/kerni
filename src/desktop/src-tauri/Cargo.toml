[package]
name = "kerni"
version = "0.1.0"
description = "Kerni, la mascota que cuida la salud de tu PC"
edition = "2021"

[lib]
name = "kerni_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
rusqlite = { version = "0.37", features = ["bundled"] }
